<!DOCTYPE html>
<html>
    <head>
        <title>Quiz sugli aerei</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
        <link href="../style.css" type="text/css" rel="stylesheet" />
        <script src="../js/quiz.js"></script>
    </head>
    <body style="background-color: #111">
        <div class="main-content quiz">
            <h1 class="quiz-title">Quiz sugli aerei</h1>
            <div class="quiz-element">
                <img src="https://readyfortakeoffbook.com/cdn/shop/articles/image-hero-Boeing-747-400-ER.webp" />
                <div class="quiz-element-text">
                    <span>L'aereo raffigurato è un:</span>
                    <br><br>

                    <input type="radio" name="question0" value="wrong" />
                    <label>Airbus A340</label><br>

                    <input type="radio" name="question0" value="right" />
                    <label>Boeing 747</label><br>

                    <input type="radio" name="question0" value="wrong" />
                    <label>Airbus A380</label><br>

                    <input type="radio" name="question0" value="wrong" />
                    <label>Boeing 787</label><br>
                </div>
            </div>
            <div class="quiz-element">
                <img src="../images/pa28.jpg" />
                <div class="quiz-element-text">
                    <span>L'aereo raffigurato è un:</span>
                    <br><br>

                    <input type="radio" name="question1" value="wrong" />
                    <label>Boeing </label><br>

                    <input type="radio" name="question1" value="wrong" />
                    <label>Piper PA-48</label><br>

                    <input type="radio" name="question1" value="wrong" />

                    <input type="radio" name="question1" value="right" />

                <div class="quiz-element-text">
                    <span>L'aereo raffigurato è un:</span>
                    <br><br>

                    <input type="radio" name="question2" value="right" />
                    <label>General Dynamics F-16</label><br>

                    <input type="radio" name="question2" value="wrong" />
                    <label>Cessna Citation</label><br>

                    <input type="radio" name="question2" value="wrong" />

                    <input type="radio" name="question2" value="wrong" />

                </div>
            </div>

                <img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Air_France_Concorde_Jonsson.jpg" />
                <div class="quiz-element-text">
                    <span>L'aereo raffigurato è un:</span>
                    <br><br>

                    <input type="radio" name="question3" value="right" />

                    <input type="radio" name="question3" value="wrong" />

                    <input type="radio" name="question3" value="wrong" />

                    <input type="radio" name="question3" value="wrong" />

            </div>
            <div class="quiz-element">
                <img src="https://images.aircharterservice.com/global/aircraft-guide/cargo-charter/mcdonnell-douglas-dc9-15-1.jpg" />
                <div class="quiz-element-text">

                    <input type="radio" name="question4" value="wrong" />
